site_name: Power BI Bootcamp
site_description: From Beginner to Job-Ready Data Analyst
site_author: Krish Sabapathy
site_url: https://sabakrish.github.io/powerbi-bootcamp/
repo_name: sabakrish/powerbi-bootcamp
repo_url: https://github.com/sabakrish/powerbi-bootcamp

theme:
  name: material
  language: en

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

  palette:

    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md